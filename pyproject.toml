[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dns-shop-mcp"
version = "0.1.0"
description = "MCP server for DNS (dns-shop.ru): live city prices, search with sorting and price filters, per-product ratings and reviews, store stock split into packaged units and showcase samples, weekly price history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "dns-shop", "electronics", "price-comparison", "llm-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.2,<3",
    "requests>=2.31",
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/SZhukovWork/dns-shop-mcp"
Repository = "https://github.com/SZhukovWork/dns-shop-mcp"
Issues = "https://github.com/SZhukovWork/dns-shop-mcp/issues"
Changelog = "https://github.com/SZhukovWork/dns-shop-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dns-shop-mcp = "dns_shop_mcp.lazy_stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dns_shop_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real dns-shop.ru (deselected unless -m live)"]
addopts = "-m 'not live'"
